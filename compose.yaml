# Loadder Docker D1 - LOCAL DEVELOPMENT ONLY (NODE_ENV=development; never use as production).
# Start: docker compose up --build        Web http://localhost:5173  API http://localhost:3001  Public sites http://localhost:3002
# Host ports collide easily; set LOADDER_WEB_PORT / LOADDER_API_PORT / LOADDER_PUBLIC_PORT (env or untracked .env).
# Every browser-facing URL below is derived from them, so CORS, cookies and generated links stay consistent.
# All writable state lives in the `loadder-data` volume (/data). It is independent of the
# repository's tracked server/db/loadder.sqlite, which is never copied into an image or volume.
name: loadder

x-image: &image
  build: { context: ., target: dev }
  image: loadder-dev

services:
  server:
    <<: *image
    # The existing supervisor runs the API, the public-site runtime and the commerce outbox worker.
    working_dir: /app/server
    entrypoint: ["/app/docker/server-entrypoint.sh"]
    command: ["node", "start.mjs"]
    ports: ["127.0.0.1:${LOADDER_API_PORT:-3001}:3001", "127.0.0.1:${LOADDER_PUBLIC_PORT:-3002}:3002"]
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      PUBLIC_SITE_HOST: 0.0.0.0
      PUBLIC_SITE_PORT: "3002"
      # Host-facing URLs: the browser on the host, not a Docker service name, must be able to use them.
      API_PUBLIC_URL: http://localhost:${LOADDER_API_PORT:-3001}
      PUBLIC_SITE_BASE_URL: http://localhost:${LOADDER_PUBLIC_PORT:-3002}
      CLIENT_ORIGINS: http://localhost:${LOADDER_WEB_PORT:-5173}
      DATABASE_PATH: /data/db/loadder.sqlite
      SITE_MEDIA_LOCAL_DIR: /data/site-media
      MEDICAL_DOCUMENT_DEV_DIR: /data/medical-private
      LOADDER_OBJECT_STORAGE_DIR: /data/object-storage
      # Development-only values; override from a local, untracked .env if you wish.
      AUTH_HASH_SECRET: ${AUTH_HASH_SECRET:-loadder-docker-development-only-secret}
      AUTH_EXPOSE_DEV_OTP: "true"
      BUSINESS_BUILDER_PUBLIC_APPS_ENABLED: "true"
    volumes: ["loadder-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    <<: *image
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports: ["127.0.0.1:${LOADDER_WEB_PORT:-5173}:5173"]
    environment:
      # Baked into browser requests, so it must be the host-visible address (not http://server:3001).
      VITE_API_BASE_URL: http://localhost:${LOADDER_API_PORT:-3001}
    # Source is bind-mounted for hot reload; node_modules stay the image's Linux install.
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Browser verification inside Linux, sharing /data with the server (the suites read SQLite directly).
  # Run with docker/e2e.sh; it uses an isolated project and a fresh volume per suite.
  playwright:
    profiles: ["e2e"]
    build: { context: ., target: e2e }
    image: loadder-e2e
    entrypoint: ["/app/docker/e2e-entrypoint.sh"]
    working_dir: /app
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://localhost:3001
      E2E_DATABASE_PATH: /data/db/loadder.sqlite
      E2E_VIDEO_FIXTURE: /tmp/performance.webm
    volumes:
      - loadder-data:/data
      - ./e2e:/app/e2e:ro
      - ./src:/app/src:ro
      - ./test-results:/app/test-results

volumes:
  loadder-data:
