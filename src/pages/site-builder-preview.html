<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loadder Preview</title><style>body{margin:0;background:#08080b;color:#f7f7f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.8}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.hero{min-height:70vh;display:grid;align-items:center;background-size:cover;background-position:center}.hero-content{max-width:780px;padding:56px 0}.hero h1{font-size:clamp(42px,7vw,76px);line-height:1.1}.muted{color:#a1a1aa}.section{padding:64px 0;border-top:1px solid #18181b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#111116;border:1px solid #27272a;border-radius:22px;padding:22px}.product{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}</style></head><body><div class="wrap"><div id="app"></div></div></body></html>
