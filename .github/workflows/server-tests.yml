name: Server Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sprint-0-clean]

jobs:
  server-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm run test:server
