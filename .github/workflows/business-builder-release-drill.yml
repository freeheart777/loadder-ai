name: Business Builder Release Drill
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/app/business-builder/**"
      - "server/test/business-builder-production-*.test.mjs"
      - "server/db/migrations/05*.mjs"
      - ".github/workflows/business-builder-release-drill.yml"
concurrency:
  group: business-builder-release-drill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm ci --prefix server --prefer-offline --no-audit
      - name: Production operations acceptance
        run: node --test --test-concurrency=1 server/test/business-builder-production-hardening.test.mjs server/test/business-builder-production-release-hardening.test.mjs server/test/business-builder-production-operations.test.mjs server/test/business-builder-backup-restore-drill.test.mjs
