name: Growth Loop Browser E2E
on:
  pull_request:
    branches: [main]
    paths: ["src/**", "server/**", "e2e/growth/**", "playwright.config.ts", "package.json", "package-lock.json", ".github/workflows/growth-loop-browser-e2e.yml"]
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  growth-loop-browser-e2e:
    name: Growth Loop Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: http://127.0.0.1:4176
      E2E_API_BASE_URL: http://127.0.0.1:3202
      E2E_DATABASE_PATH: ${{ runner.temp }}/loadder-growth-e2e/test.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm --prefix server ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated modular monolith
        run: |
          mkdir -p "$RUNNER_TEMP/loadder-growth-e2e"
          DATABASE_PATH="$E2E_DATABASE_PATH" NODE_ENV=test API_HOST=127.0.0.1 API_PORT=3202 AUTH_EXPOSE_DEV_OTP=true AUTH_HASH_SECRET=growth-e2e-secret CLIENT_ORIGINS=http://127.0.0.1:4176 node server/index.mjs >"$RUNNER_TEMP/loadder-growth-e2e/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/loadder-growth-e2e/backend.pid"
          VITE_API_BASE_URL=http://127.0.0.1:3202 npx vite --host 127.0.0.1 --port 4176 --strictPort >"$RUNNER_TEMP/loadder-growth-e2e/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/loadder-growth-e2e/frontend.pid"
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:3202/api/health >/dev/null && curl -fsS http://127.0.0.1:4176/ >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/loadder-growth-e2e/backend.log"; cat "$RUNNER_TEMP/loadder-growth-e2e/frontend.log"; exit 1
      - name: Run focused journey five times with zero retries
        run: for run in {1..5}; do npx playwright test e2e/growth/growth-loop.spec.ts --project=chromium; done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: growth-loop-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/loadder-growth-e2e/frontend.pid")" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/loadder-growth-e2e/backend.pid")" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/loadder-growth-e2e"
