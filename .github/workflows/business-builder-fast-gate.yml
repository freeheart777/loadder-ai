name: Business Builder Fast Gate

on:
  push:
    branches: ["feat/**"]
    paths:
      - "server/app/business-builder/**"
      - "server/test/business-builder-*.test.mjs"
      - "src/components/business-builder/**"
      - "src/pages/BusinessBuilderPage.tsx"
      - "src/pages/GeneratedBusinessAppPage.tsx"
      - ".github/workflows/business-builder-fast-gate.yml"
  pull_request:
    paths:
      - "server/app/business-builder/**"
      - "server/test/business-builder-*.test.mjs"
      - "src/components/business-builder/**"
      - "src/pages/BusinessBuilderPage.tsx"
      - "src/pages/GeneratedBusinessAppPage.tsx"
  workflow_dispatch:

concurrency:
  group: business-builder-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install server dependencies
        run: npm ci --prefix server --prefer-offline --no-audit
      - name: Critical module import smoke
        run: |
          node -e "Promise.all(['business-compiler','app-renderer','editor-patch','navigator','publish-readiness','postgres-data-adapter'].map(x=>import('./server/app/business-builder/'+x+'.mjs'))).then(()=>console.log('critical imports ok'))"
      - name: Targeted business builder tests
        run: node --test --test-concurrency=1 server/test/business-builder-*.test.mjs
      - name: Targeted builder UI typecheck
        run: >-
          npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution bundler
          --jsx react-jsx --skipLibCheck --verbatimModuleSyntax true --types vite/client
          src/pages/BusinessBuilderPage.tsx src/pages/GeneratedBusinessAppPage.tsx
          src/components/business-builder/ApprovalCenter.tsx src/components/business-builder/PublishCenter.tsx
