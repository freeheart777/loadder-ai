name: Security Supply Chain Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static backdoor and secret gate
        run: node server/scripts/security-static-gate.mjs
      - name: Root dependency audit
        run: npm audit --audit-level=critical --omit=dev
      - name: Server dependency audit
        run: npm --prefix server audit --audit-level=critical --omit=dev
