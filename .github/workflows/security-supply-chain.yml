name: Security Supply Chain Gate

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static backdoor and secret gate
        run: node server/scripts/security-static-gate.mjs
      - name: Root dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=critical --omit=dev; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "npm audit unavailable or failed; retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done
      - name: Server dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm --prefix server audit --audit-level=critical --omit=dev; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "server npm audit unavailable or failed; retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done
