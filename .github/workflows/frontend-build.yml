name: Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck critical UI paths
        run: >-
          npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution bundler
          --jsx react-jsx --skipLibCheck --verbatimModuleSyntax true --types vite/client
          src/pages/GoogleAdsSearchWizardPage.tsx
          src/pages/GoogleAdsConnectedWizardPage.tsx
          src/pages/AdsCenterWithGoogleEntryPage.tsx
          src/pages/VisualWebsiteStudioPage.tsx
          src/pages/StoreWebsiteStudioPageV16.tsx
          src/pages/StoreWebsiteStudioPageV16Core.tsx
          src/pages/StoreCommerceManagerPage.tsx
          src/pages/StoreCommerceManagerPageCore.tsx
          src/pages/StoreProductDetailPage.tsx
          src/components/commerce/ProductMediaEditor.tsx
          src/lib/activeStoreProject.ts
          src/lib/siteMediaUpload.ts
          src/lib/productMedia.ts
      - name: Build Vite bundle
        run: npx vite build
