name: Experiment Provider

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    paths:
      - 'server/app/experiments/**'
      - 'server/app/repositories/experiment-repository.mjs'
      - 'server/app/routes/human-governance.mjs'
      - 'server/test/experiment-*.mjs'
      - '.github/workflows/experiment-provider.yml'

jobs:
  test-experiment-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node --test test/experiment-execution-service.test.mjs test/experiment-provider.test.mjs test/experiment-execution-provider.test.mjs test/experiment-run-service.test.mjs test/experiment-run-route.test.mjs
