name: Experiment Provider

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    paths:
      - 'server/app/experiments/**'
      - 'server/app/repositories/experiment-repository.mjs'
      - 'server/app/repositories/experiment-run-repository.mjs'
      - 'server/app/routes/experiment-execution.mjs'
      - 'server/app/routes/human-governance.mjs'
      - 'server/app/services/experiment-run-service.mjs'
      - 'server/test/experiment-*.mjs'
      - '.github/workflows/experiment-provider.yml'

jobs:
  experiment-execution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: |
          set -e
          for test_file in \
            test/experiment-execution-service.test.mjs \
            test/experiment-provider.test.mjs \
            test/experiment-execution-provider.test.mjs \
            test/experiment-run-service.test.mjs \
            test/experiment-run-route.test.mjs; do
            if [ -f "$test_file" ]; then
              node --test "$test_file"
            else
              echo "SKIP missing $test_file"
            fi
          done
